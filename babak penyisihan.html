<style>
:root{--gold:#facc15;--danger:#ef4444}
body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI,Arial;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:66px;background:#0f172a;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20}
.logo-head{display:flex;align-items:center;gap:10px}
.logo-head img{width:48px;height:48px;background:#fff;border-radius:10px;padding:3px;object-fit:contain}
.logo-head h1{margin:0;font-size:15px;color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.tab{padding:5px 9px;border-radius:999px;background:#1e293b;border:1px solid #334155;font-size:10px;cursor:pointer}
.tab.active{background:var(--gold);color:#000;font-weight:900}
.wrap{height:100vh;padding-top:66px;display:flex;justify-content:center;align-items:center;padding-bottom:50px}
.slide{position:relative;width:95%;max-width:1480px;min-height:80vh;background:#1e293bcc;border:3px solid var(--gold);border-radius:24px;overflow:hidden;display:flex}
.slide-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.18;filter:blur(1px);z-index:0}
.logo-wm{position:absolute;right:18px;top:14px;width:86px;height:86px;opacity:0.15;z-index:1;background:#fff;border-radius:14px;padding:4px}
.slide-left{position:relative;z-index:2;flex:1;padding:20px 28px;display:flex;flex-direction:column;justify-content:center}
.slide-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#ffffff18;padding:6px 12px;border-radius:12px;border:1px solid #ffffff33}
.slide-top img{width:52px;height:52px;background:#fff;border-radius:10px;padding:3px}
.school b{color:var(--gold);font-size:14px}
.soal{font-size:38px;font-weight:800;line-height:1.28;text-shadow:0 2px 14px rgba(0,0,0,0.9)}
.slide-right{position:relative;z-index:2;width:350px;background:linear-gradient(180deg,#1e293b,#0f172a);border-left:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.timer-label{font-weight:900;letter-spacing:2px;font-size:18px;color:var(--gold);text-align:center}
.timer{font-size:112px;font-weight:900;line-height:1;background:#000;border:5px solid var(--gold);border-radius:20px;padding:10px 26px;min-width:180px;text-align:center;color:var(--gold)}
.timer.warn{border-color:var(--danger);color:var(--danger);background:#450a0a;animation:blink 0.5s infinite}
@keyframes blink{50%{transform:scale(1.07)}}
.btn-timer{padding:12px 14px;border-radius:12px;border:none;font-weight:900;cursor:pointer;font-size:13px;width:100%}
.btn-start{background:#22c55e;color:#052e16}.btn-pause{background:var(--gold);color:#000}.btn-reset{background:#334155;color:#fff}.btn-audio{background:#0f172a;color:var(--gold);border:1px solid var(--gold)}
.jawab{margin-top:12px;padding:12px;background:#052e16cc;border:2px solid #22c55e;border-radius:12px;font-size:22px;color:#4ade80;display:none;font-weight:800}
.jawab.show{display:block}
.btns{margin-top:12px;display:flex;gap:8px}
.btn{padding:10px 16px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-next{background:var(--gold);color:#000}.btn-prev{background:#334155;color:#fff}.btn-ans{background:#22c55e;color:#052e16}
.footer-guru{position:fixed;bottom:0;left:0;right:0;background:#0b1220f2;border-top:2px solid var(--gold);padding:7px;text-align:center;z-index:30;display:flex;justify-content:center;align-items:center;gap:10px}
.footer-guru img{width:30px;height:30px;background:#fff;border-radius:8px;padding:2px}
.footer-guru p{margin:0;font-size:11px;font-weight:700}.footer-guru span{color:var(--gold)}
@media(max-width:900px){.slide{flex-direction:column}.slide-right{width:100%;border-left:none;border-top:3px solid var(--gold);flex-direction:row;flex-wrap:wrap}.timer{font-size:66px;min-width:110px}.soal{font-size:22px}}
</style></head><body>
<div class="header"><div class="logo-head"><img src="logo_sma3.png" onerror="this.src='logo_small.png'"><h1>SMAN3 BRILLIANT</h1></div><div class="tabs" id="tabs"></div></div>
<div class="wrap"><div class="slide"><div class="slide-bg" id="bg"></div><img class="logo-wm" src="logo_sma3.png" onerror="this.src='logo_small.png'">
<div class="slide-left"><div class="slide-top"><img src="logo_sma3.png" onerror="this.src='logo_small.png'"><div class="school"><b>SMA NEGERI 3 BORONG</b><div id="paketLabel">KODE 2 • TIMER 30 DETIK SEMUA</div></div></div><div class="soal" id="soal"></div><div class="jawab" id="jawab"></div><div class="btns"><button class="btn btn-prev" onclick="prev()">◀</button><button class="btn btn-ans" onclick="toggleAns()">Jawaban</button><button class="btn btn-next" onclick="next()">▶</button></div></div>
<div class="slide-right"><div class="timer-label">SMAN3 BRILLIANT</div><div class="timer" id="timer">30</div><div id="statusTimer" style="font-weight:800;color:#22c55e;font-size:13px">SIAP - ENTER=START</div><button class="btn-timer btn-start" onclick="startTimer()">▶ START + DING</button><button class="btn-timer btn-pause" onclick="pauseTimer()">⏸ PAUSE</button><button class="btn-timer btn-reset" onclick="resetTimer()">🔄 RESET 30</button><button class="btn-timer btn-audio" onclick="toggleAudio()" id="btnAudio">🔊 AUDIO: ON</button><div style="font-size:10px;opacity:0.6;text-align:center">30 detik semua soal • Wajib & Rebutan</div></div>
</div></div>
<div class="footer-guru"><img src="logo_sma3.png" onerror="this.src='logo_small.png'"><p><span>SMA NEGERI 3 BORONG - BRILLIANT | Guru:</span> Damasus Hans Satu, S.Pd.Gr. dan Erlina Sofia Daima, S.Pd.,Gr.</p></div>
<script>
const imageFiles = ["gambar (0).jpg","gambar (1).jpg","gambar (2).jpg","gambar (3).jpg","gambar (4).jpg","gambar (5).jpg","gambar (6).jpg","gambar (7).jpg","gambar (8).jpg","gambar (9).jpg","gambar (10).jpg","gambar (11).jpg","gambar (12).jpg","gambar (13).jpg","gambar (14).jpg","gambar (15).jpg","gambar (16).jpg"];
const packages = [
{"nama":"PAKET 1","soal":["Kebun persegi panjang panjang (2x-5) cm lebar (3x+1) cm, x=10, keliling?|96 cm","Nilai p yang memenuhi 5p -2p =12?|p=4","Hasil 4^4 . 4^-2 adalah...|16","Tata nilai 82,76,81,73 vs Titi 79,71,77,85. Perbandingan rata-rata?|Sama 78","Ruang sampel pelemparan 1 koin?|2","Berapakah hasil dari 3x + 5x - 2x + 4?|6x + 4","Diagram garis uang saku - Kenaikan terjadi?|Selasa ke Rabu","Segitiga alas 12cm tinggi 8cm, luas?|48 cm2","Jika x + y = 10 dan x - y = 2, nilai x dan y?|x=6 y=4","Sisi miring 13cm, sisi lain 5cm, sisi lain?|12cm"]},
{"nama":"PAKET 2","soal":["Lingkaran r=7cm, luas?|154 cm2","Gedung 24 lantai, tinggi tiap lantai 3m, total?|72 m","Nilai (-5)^3 adalah...|-125","Bakteri awal 10, belah 2x tiap jam, setelah 5 jam?|320","8 server, tiap server 3x10^6 berkas, total?|24x10^6","Bentuk paling sederhana 8/12 adalah...|2/3","Median data 5,6,6,6,7,7,8,9,10 adalah...|7","Jika 2x + 3 = 13, nilai x?|x=5","Kubus rusuk 10cm, volume?|1000 cm3","Persamaan 2x +5y=14 dan x=2, nilai y?|y=2"]},
{"nama":"PAKET 3","soal":["Atlet lompat jauh lompatan 1=10 cm, ke-2=20 cm, rata-rata?|15 cm","Garis lurus menghubungkan 2 titik di lingkaran melalui pusat disebut jari-jari?|SALAH, itu diameter","3a + 4b -2a + b = a + 5b?|Benar","Hasil 1 3/4 + 2 2/5 adalah...|83/20","Dua sudut saling berpelurus jika jumlahnya...|180 derajat","Jarak titik pusat ke titik pada lingkaran disebut?|Jari-jari","Sejumlah tindakan untuk memperoleh hasil tertentu disebut...|Percobaan","Dadu dilempar 1x, peluang muncul >3?|1/2","Mesin hasilkan 2^3 kotak per menit, 5 menit?|40 kotak","Sudut <90 derajat disebut?|Sudut lancip"]},
{"nama":"PAKET 4","soal":["Nilai y jika 5y -7 =3 adalah 5?|Salah, y=2","Bentuk sederhana 9m -4m +5n -n?|5m+4n","Hasil perkalian (x+3)(x-4)?|x^2 -x -12","Pak Riski punya tanah: 1/3 rumah, 2/5 kebun, sisa 120 m2 kolam. Total luas?|450 m2","Rata-rata tinggi 8 siswa 170cm dan 12 siswa 165cm, rata-rata seluruh?|167 cm","Dadu dilempar 1x, peluang muncul ganjil?|1/2","Nilai x yang memenuhi 3x+2 =5x-4?|x=3","Banyaknya ruang sampel pelemparan 1 dadu?|6","Jika 3z +5 = 2z +8 maka z?|z=3","Hasil 1/4+1/2 adalah...|3/4"]},
{"nama":"PAKET 5","soal":["Jika x=5 dan y=3, nilai 2x + 4y?|22","2 garis berpotongan jika punya 1 titik persekutuan?|Benar","Hasil perkalian (2x + 3)(x - 4)?|2x^2 -5x -12","Ibu punya 3/4 liter minyak, dipakai 1/8 liter, sisa?|5/8 liter","Andi bagi semangka: Agus 1/4, Beni 1/4, sisa Mukti?|1/2","Bentuk persen dari 2/5 adalah...|40%","Sudut <90 derajat disebut?|Sudut lancip","Modus data 72,69,63,72,79,77,67,65 adalah...|72","Pecahan senilai 56/128 adalah...|7/16","Diameter 16cm, jari-jari?|8cm"]},
{"nama":"PAKET 6","soal":["Besar sudut jam pukul 15.00?|90 derajat","Hasil 5^0 +2^-1 +3^-1 adalah...|11/6","Persegi panjang 12cm x5cm, diagonal?|13cm","Jika a=2 dan b=-3, nilai 2a^2 - ab + b^2?|23","Hasil 7^5 / 7^3 adalah...|49","Hasil 1/4+1/2 adalah...|3/4","Hasil 16^1/4 + 32^1/5 adalah...|4","Hasil perkalian (2x + 3)(x - 4)?|2x^2 -5x -12","Penyelesaian 4x - 3 < 2x + 5 adalah...|x < 4","Atlet lompat jauh 10cm & 20cm, rata-rata?|15 cm"]},
{"nama":"PAKET 7 - REBUTAN BARU","soal":["Hasil 81 pangkat 3/4 adalah...|27","Kebun persegi panjang p=15m l=9m, keliling & luas?|K=48m, L=135m","Penyiku sudut 35 derajat?|55 derajat","Tata nilai 82,76,81,73 vs Titi 79,71,77,85. Rata-rata?|Sama 78","Bakteri awal 10, belah 2x tiap jam, setelah 5 jam?|320","Diagram garis uang saku - Kenaikan?|Selasa ke Rabu","Mesin 2^3 kotak per menit, 5 menit?|40 kotak","Gedung 24 lantai, tiap lantai 3m, total?|72 m","Lingkaran r=7cm, luas?|154 cm2","Segitiga siku-siku 6cm & 8cm, sisi miring?|10cm"]}
];
let curPaket=0,curSoal=0,timeLeft=30,timerInterval=null,isRunning=false,audioOn=true,audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,t,v){if(!audioOn)return;initAudio();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=f;o.type=t||'sine';g.gain.value=v||0.3;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}
function playStart(){beep(880,0.3,'sine',0.4);setTimeout(()=>beep(1320,0.4,'sine',0.4),150);}
function playTick(){beep(1000,0.15,'square',0.2);}
function playWarning(){beep(1200,0.2,'square',0.3);}
function playEnd(){beep(440,0.8,'sawtooth',0.5);setTimeout(()=>beep(330,1.2,'sawtooth',0.5),300);}
function toggleAudio(){audioOn=!audioOn;document.getElementById('btnAudio').textContent=audioOn?'🔊 AUDIO: ON':'🔇 AUDIO: OFF';}
function getImg(p,s){let seed=p*137+s*71+13;seed=(seed*9301+49297)%233280;return imageFiles[seed%imageFiles.length];}
function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';packages.forEach((p,i)=>{const d=document.createElement('div');d.className='tab'+(i===curPaket?' active':'');d.textContent=p.nama;d.onclick=()=>{curPaket=i;curSoal=0;renderTabs();render();};t.appendChild(d);});}
function updateTimer(){const el=document.getElementById('timer');const st=document.getElementById('statusTimer');el.textContent=timeLeft<=0?'HABIS':timeLeft;if(timeLeft<=5&&timeLeft>0){el.classList.add('warn');st.textContent='HAMPIR HABIS! '+timeLeft;st.style.color='#ef4444';if(isRunning)playTick();}else if(timeLeft<=0){el.classList.add('warn');st.textContent='WAKTU HABIS!';}else{el.classList.remove('warn');st.textContent=isRunning?'BERJALAN 30 DETIK...':'SMAN3 BRILLIANT - SIAP 30 DETIK';st.style.color='#22c55e';}}
function startTimer(){if(isRunning)return;initAudio();playStart();isRunning=true;updateTimer();timerInterval=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=5&&timeLeft>0)playWarning();if(timeLeft<=0){clearInterval(timerInterval);isRunning=false;updateTimer();playEnd();}},1000);}
function pauseTimer(){clearInterval(timerInterval);isRunning=false;updateTimer();}
function resetTimer(){pauseTimer();timeLeft=30;updateTimer();}
function render(){const raw=packages[curPaket].soal[curSoal];const parts=raw.split('|');document.getElementById('soal').textContent=parts[0].trim();document.getElementById('jawab').textContent='Jawaban: '+ (parts[1]||'').trim();document.getElementById('jawab').classList.remove('show');document.getElementById('bg').style.backgroundImage=`url('${getImg(curPaket,curSoal)}')`;document.getElementById('paketLabel').textContent=`${packages[curPaket].nama} • Soal ${curSoal+1}/${packages[curPaket].soal.length} • 30 DETIK • gambar (0) acak`;resetTimer();}
function next(){const p=packages[curPaket];if(curSoal<p.soal.length-1)curSoal++;else if(curPaket<packages.length-1){curPaket++;curSoal=0;renderTabs();}render();}
function prev(){if(curSoal>0)curSoal--;else if(curPaket>0){curPaket--;curSoal=packages[curPaket].soal.length-1;renderTabs();}render();}
function toggleAns(){document.getElementById('jawab').classList.toggle('show');}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();toggleAns();}if(e.key==='Enter'){isRunning?pauseTimer():startTimer();}});
renderTabs();render();
</script></body></html>
